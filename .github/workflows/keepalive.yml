# Render's free plan sleeps after 15 minutes without traffic, and the first request then
# takes ~50s. This pings the backend so it stays awake. Set the repository variable
# BACKEND_URL (Settings → Secrets and variables → Actions → Variables) to enable it.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.BACKEND_URL }}/health"
